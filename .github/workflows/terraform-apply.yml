# ==============================================================
# terraform-apply.yml
#
# Dieser Workflow führt `terraform apply` aus und deployt
# eine index.html auf die EC2-Instanz per SSH.
#
# Auslöser:
#   - Push auf den main-Branch
#   - Manuell (workflow_dispatch)
#   - Zeitgesteuert: Montag–Freitag um 08:00 Uhr (CET/CEST)
#
# Benötigte GitHub Secrets:
#   - AWS_ACCESS_KEY_ID       → AWS Zugangsdaten (Schlüssel-ID)
#   - AWS_SECRET_ACCESS_KEY   → AWS Zugangsdaten (geheimer Schlüssel)
#   - EC2_KEY_NAME            → Name des AWS Key-Pairs (z.B. "mein-key")
#   - EC2_SSH_PRIVATE_KEY     → Inhalt der .pem-Datei (privater SSH-Schlüssel)
#   - SLACK_WEBHOOK_URL       → Slack Webhook-URL (optional, für Benachrichtigungen)
# ==============================================================

name: "Terraform Apply"

on:
  push:
    branches:
      - main

  # Manueller Auslöser über die GitHub Actions-Oberfläche
  workflow_dispatch:

  # Zeitgesteuert: Montag–Freitag um 06:00 UTC (= 08:00 CET / 09:00 CEST)
  

jobs:
  terraform-apply:
    name: "Infrastruktur erstellen und deployen"
    runs-on: ubuntu-latest

    # Ausgabewerte, die andere Jobs oder Steps verwenden können
    outputs:
      public_ip: ${{ steps.terraform-output.outputs.public_ip }}

    steps:
      # ------------------------------------------------------------
      # Schritt 1: Code aus dem Repository auschecken
      # ------------------------------------------------------------
      - name: "Code auschecken"
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Schritt 2: Terraform installieren (bestimmte Version festlegen
      # für reproduzierbare Builds)
      # ------------------------------------------------------------
      - name: "Terraform installieren"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false # Deaktiviert den Wrapper für sauberere Output-Verarbeitung

      # ------------------------------------------------------------
      # Schritt 3: AWS Zugangsdaten konfigurieren
      # Die Werte kommen aus den GitHub Secrets des Repositories.
      # Niemals echte Zugangsdaten direkt in den Workflow schreiben!
      # ------------------------------------------------------------
      - name: "AWS Zugangsdaten konfigurieren"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      # ------------------------------------------------------------
      # Schritt 4: Öffentliche IP des GitHub Actions Runners ermitteln.
      # Diese IP wird für die SSH Security Group freigegeben,
      # damit der Runner sich später mit der EC2-Instanz verbinden kann.
      # ------------------------------------------------------------
      - name: "Öffentliche IP des Runners ermitteln"
        id: runner-ip
        run: |
          RUNNER_IP=$(curl -s ifconfig.me)
          echo "ip=${RUNNER_IP}/32" >> $GITHUB_OUTPUT
          echo "Runner-IP: ${RUNNER_IP}/32"

      # ------------------------------------------------------------
      # Schritt 5: Terraform initialisieren
      # Lädt Provider-Plugins herunter und verbindet sich mit dem
      # S3-Backend für die State-Datei.
      # ------------------------------------------------------------
      - name: "Terraform Init"
        run: terraform init

      # ------------------------------------------------------------
      # Schritt 6: SSH-Schlüssel aus Secret sicher ablegen
      # Muss VOR terraform apply bereitstehen, da der Provisioner
      # in main.tf diesen Pfad während apply verwendet.
      # Die Datei wird am Ende des Workflows wieder gelöscht (Schritt 10).
      # ------------------------------------------------------------
      - name: "SSH-Schlüssel vorbereiten"
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > /tmp/ec2-key.pem
          chmod 400 /tmp/ec2-key.pem

      # ------------------------------------------------------------
      # Schritt 7: Terraform Apply ausführen
      # Der remote-exec Provisioner in main.tf verbindet sich automatisch
      # per SSH und installiert Apache — kein separater SSH-Schritt nötig.
      # ------------------------------------------------------------
      - name: "Terraform Apply"
        run: |
          terraform apply -auto-approve \
            -var="ssh_allowed_cidr=${{ steps.runner-ip.outputs.ip }}" \
            -var="key_name=${{ secrets.EC2_KEY_NAME }}" \
            -var="ec2_private_key_path=/tmp/ec2-key.pem"

      # ------------------------------------------------------------
      # Schritt 8: Public IP aus den Terraform Outputs lesen
      # ------------------------------------------------------------
      - name: "Public IP der EC2-Instanz auslesen"
        id: terraform-output
        run: |
          PUBLIC_IP=$(terraform output -json instanz_oeffentliche_ips | jq -r '.[0]')
          echo "public_ip=${PUBLIC_IP}" >> $GITHUB_OUTPUT
          echo "Instanz Public IP: ${PUBLIC_IP}"

      # ------------------------------------------------------------
      # Schritt 9: index.html per SSH deployen
      # Apache läuft bereits (durch Terraform Provisioner installiert).
      # Hier wird nur die HTML-Datei mit Deploy-Infos kopiert.
      # ------------------------------------------------------------
      - name: "index.html per SSH auf EC2 deployen"
        run: |
          PUBLIC_IP="${{ steps.terraform-output.outputs.public_ip }}"
          DEPLOY_DATUM=$(date '+%d.%m.%Y %H:%M:%S UTC')
          COMMIT_SHA="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"

          cat > /tmp/index.html << EOF
          <!DOCTYPE html>
          <html lang="de">
          <head>
            <meta charset="UTF-8">
            <title>Terraform + GitHub Actions</title>
            <style>
              body { font-family: sans-serif; max-width: 600px; margin: 60px auto; }
              h1   { color: #2d6a4f; }
              code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; }
            </style>
          </head>
          <body>
            <h1>Erfolgreich deployed!</h1>
            <p>Diese Seite wurde automatisch via <strong>GitHub Actions + Terraform</strong> bereitgestellt.</p>
            <ul>
              <li><strong>Datum:</strong> ${DEPLOY_DATUM}</li>
              <li><strong>Branch:</strong> <code>${BRANCH}</code></li>
              <li><strong>Commit:</strong> <code>${COMMIT_SHA:0:7}</code></li>
              <li><strong>Server:</strong> ${PUBLIC_IP}</li>
            </ul>
          </body>
          </html>
          EOF

          scp -i /tmp/ec2-key.pem \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            /tmp/index.html \
            ec2-user@${PUBLIC_IP}:/tmp/index.html

          ssh -i /tmp/ec2-key.pem \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ec2-user@${PUBLIC_IP} \
            "sudo cp /tmp/index.html /var/www/html/index.html"

          echo "Webseite erreichbar unter: http://${PUBLIC_IP}"

      # ------------------------------------------------------------
      # Schritt 10: Verbindungstest — prüfen ob die Webseite antwortet
      # ------------------------------------------------------------
      - name: "Webseite erreichbar testen"
        run: |
          PUBLIC_IP="${{ steps.terraform-output.outputs.public_ip }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${PUBLIC_IP}")
          if [ "${HTTP_STATUS}" = "200" ]; then
            echo "Webseite antwortet mit HTTP 200 — Deployment erfolgreich!"
          else
            echo "Warnung: Webseite antwortet mit HTTP ${HTTP_STATUS}"
          fi

      # ------------------------------------------------------------
      # Schritt 11: SSH-Schlüssel sicher löschen (immer ausführen)
      # ------------------------------------------------------------
      - name: "SSH-Schlüssel löschen"
        if: always()
        run: rm -f /tmp/ec2-key.pem /tmp/index.html

      # ------------------------------------------------------------
      # Schritt 12: Slack-Benachrichtigung — Erfolg
      # Wird nur gesendet wenn alle vorherigen Schritte erfolgreich waren.
      # Setzt voraus: SLACK_WEBHOOK_URL ist als GitHub Secret gesetzt.
      # ------------------------------------------------------------
      - name: "Slack-Benachrichtigung senden (Erfolg)"
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *Terraform Apply erfolgreich!*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Terraform Apply erfolgreich!*\n*Projekt:* `terraform-wiederholung`\n*Public IP:* `${{ steps.terraform-output.outputs.public_ip }}`\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Ausgeführt von:* ${{ github.actor }}\n*Webseite:* http://${{ steps.terraform-output.outputs.public_ip }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # ------------------------------------------------------------
      # Schritt 13: Slack-Benachrichtigung — Fehler
      # Wird nur gesendet wenn ein Schritt fehlgeschlagen ist.
      # ------------------------------------------------------------
      - name: "Slack-Benachrichtigung senden (Fehler)"
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ *Terraform Apply fehlgeschlagen!*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Terraform Apply fehlgeschlagen!*\n*Projekt:* `terraform-wiederholung`\n*Branch:* `${{ github.ref_name }}`\n*Ausgeführt von:* ${{ github.actor }}\n*Details:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow-Log öffnen>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
